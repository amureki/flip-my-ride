<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Flip My Ride — social image</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
    body { background: #f3f0e9; color: #16191d; font-family: Arial, sans-serif; }
    canvas { position: absolute; inset: 0; }
    main { position: absolute; left: 64px; top: 150px; }
    h1 { margin: 0; font-size: 88px; line-height: .98; letter-spacing: -3px; }
    p { margin: 30px 0 0; font-size: 42px; line-height: 1.18; letter-spacing: -1px; }
  </style>
</head>
<body>
  <main><h1>Flip<br>My Ride.</h1><p>No driving.<br>Only flips.</p></main>
  <script type="module">
    import * as THREE from 'three';
    import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
    import { makeRoadster } from '../src/roadster.ts';

    // Render the game's own model; this composition is only used for the social card.
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(1200, 630);
    renderer.setPixelRatio(1);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.15;
    document.body.prepend(renderer.domElement);
    const scene = new THREE.Scene();
    const camera = new THREE.OrthographicCamera(-6.8, 6.8, 3.57, -3.57, .1, 100);
    camera.position.set(10, 13, 18);
    camera.lookAt(0, 1.65, 0);
    camera.updateMatrixWorld();
    // Move the scene to the right, leaving the title's column clear.
    const shift = new THREE.Vector3(1, 0, 0).applyQuaternion(camera.quaternion).multiplyScalar(2.25);
    const subject = new THREE.Group();
    subject.position.copy(shift);
    subject.scale.setScalar(1.35);
    scene.add(subject);
    scene.add(new THREE.HemisphereLight(0xe7f0ff, 0x687381, 1.8));
    const sun = new THREE.DirectionalLight(0xfff3df, 2.8);
    sun.position.set(-3, 18, 10);
    sun.castShadow = true;
    sun.shadow.mapSize.set(2048, 2048);
    Object.assign(sun.shadow.camera, { left: -12, right: 12, top: 12, bottom: -12 });
    sun.shadow.normalBias = .025;
    sun.shadow.radius = 4;
    scene.add(sun);
    const ground = new THREE.Mesh(new THREE.PlaneGeometry(200, 200), new THREE.ShadowMaterial({ opacity: .16 }));
    ground.rotation.x = -Math.PI / 2;
    ground.receiveShadow = true;
    scene.add(ground);
    const bay = new THREE.Mesh(new THREE.BoxGeometry(3.3, .025, 4.7), new THREE.MeshStandardMaterial({ color: 0x809b69, roughness: 1 }));
    bay.receiveShadow = true;
    subject.add(bay);
    for (const x of [-1.65, 1.65]) {
      const stripe = new THREE.Mesh(new THREE.BoxGeometry(.055, .03, 4.7), new THREE.MeshBasicMaterial({ color: 0xedffd1 }));
      stripe.position.set(x, .015, 0);
      subject.add(stripe);
    }
    for (const z of [-2.35, 2.35]) {
      const stripe = new THREE.Mesh(new THREE.BoxGeometry(3.3, .03, .055), new THREE.MeshBasicMaterial({ color: 0xedffd1 }));
      stripe.position.set(0, .015, z);
      subject.add(stripe);
    }
    const { car } = makeRoadster();
    car.position.set(0, 2.15, 0);
    car.rotation.set(0, -.28, -.62);
    car.scale.multiplyScalar(1.3);
    subject.add(car);
    const room = new RoomEnvironment();
    const pmrem = new THREE.PMREMGenerator(renderer);
    const reflections = pmrem.fromScene(room, .04);
    car.traverse(object => {
      if (object instanceof THREE.Mesh && object.material instanceof THREE.MeshStandardMaterial) {
        object.material.envMap = reflections.texture;
        object.material.envMapIntensity = .45;
      }
    });
    room.dispose();
    pmrem.dispose();
    renderer.render(scene, camera);
    document.documentElement.dataset.ready = 'true';
  </script>
</body>
</html>
